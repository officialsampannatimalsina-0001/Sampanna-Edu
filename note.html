<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Sampanna Edu educational platform"><title>Note | Sampanna Edu</title><link rel="stylesheet" href="css/style.css"></head><body><div id="site-header"></div><main><section class="page-hero"><div class="container"><span class="breadcrumb">Sampanna Edu / Note</span><h1 id="title">Loading…</h1><p id="meta"></p></div></section><section class="section"><div class="container" style="max-width:850px"><article class="card"><div id="content" style="white-space:pre-wrap"></div></article></div></section></main><div id="site-footer"></div><script type="module" src="js/app.js"></script><script type="module">
import { supabase } from "./js/supabase.js";
const id=new URLSearchParams(location.search).get("id");
if(!supabase){document.getElementById("content").textContent="Configure Supabase first."}
else if(id){const {data:n,error}=await supabase.from("notes").select("*,subjects(name),chapters(name)").eq("id",id).eq("published",true).single();if(error||!n){document.getElementById("content").textContent="Note not found.";document.getElementById("title").textContent="Not found"}else{document.getElementById("title").textContent=n.title;document.getElementById("meta").textContent=[n.exam,n.subjects?.name,n.chapters?.name].filter(Boolean).join(" · ");document.getElementById("content").textContent=n.content||"";}}
</script></body></html>
