<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Sampanna Edu educational platform"><title>Mock Tests | Sampanna Edu</title><link rel="stylesheet" href="css/style.css"></head><body><div id="site-header"></div><main><section class="page-hero"><div class="container"><span class="breadcrumb">Sampanna Edu / Mock Tests</span><h1>Mock Tests</h1><p>Take available timed tests. No student login is required; your result is saved in this browser.</p></div></section><section class="section"><div class="container"><div id="tests" class="grid-3"><div class="spinner">Loading tests…</div></div></div></section></main><div id="site-footer"></div><script type="module" src="js/app.js"></script><script type="module">
import { supabase } from "./js/supabase.js";
const box=document.getElementById("tests"),exam=new URLSearchParams(location.search).get("exam");
async function load(){if(!supabase){box.innerHTML='<div class="empty">Configure Supabase first.</div>';return;}let q=supabase.from("quizzes").select("*").eq("published",true).order("created_at",{ascending:false});if(exam)q=q.eq("exam",exam);const {data,error}=await q;if(error){box.innerHTML='<div class="empty">'+error.message+'</div>';return;}box.innerHTML=data?.length?data.map(t=>`<article class="card resource-card"><span class="pill">${esc(t.exam||"Mock")}</span><h3>${esc(t.title)}</h3><p>${esc(t.description||"")}</p><small>${t.duration_minutes||0} minutes · ${t.question_count||0} questions</small><div style="margin-top:15px"><a class="btn btn-primary btn-small" href="mock.html?id=${t.id}">Start Test →</a></div></article>`).join(""):'<div class="empty">No mock tests published yet. Add one from Admin.</div>'}function esc(x=""){return x.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}load();
</script></body></html>
