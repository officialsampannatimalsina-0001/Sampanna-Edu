<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Sampanna Edu educational platform"><title>Admin | Sampanna Edu</title><link rel="stylesheet" href="css/style.css"></head><body><div id="site-header"></div><main><section class="page-hero"><div class="container"><span class="breadcrumb">Sampanna Edu / Admin</span><h1>Admin Dashboard</h1><p>Manage your educational content. Student login is not required; this page is owner/admin-only.</p></div></section><section class="section"><div class="container"><div id="gate" class="empty">Checking admin access…</div><div id="adminApp" class="admin-layout hidden"><aside class="admin-side"><button class="active" data-tab="questions">🧠 Questions</button><button data-tab="subjects">📚 Subjects</button><button data-tab="chapters">📖 Chapters</button><button data-tab="notes">📝 Notes</button><button data-tab="quizzes">⏱️ Quizzes</button></aside><div class="admin-panel" id="panel"></div></div></div></section></main><div id="site-footer"></div><script type="module" src="js/app.js"></script><script type="module">
import {supabase,getUser,isAdmin} from "./js/supabase.js";
const gate=document.getElementById("gate"),app=document.getElementById("adminApp"),panel=document.getElementById("panel");let user,tab="questions";
const esc=x=>(x??"").toString().replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
async function start(){if(!supabase){gate.textContent="Configure Supabase first.";return}user=await getUser();if(!user||!(await isAdmin(user.id))){gate.innerHTML='Admin access required. <a href="login.html" style="color:var(--blue)">Open profile</a><br><small>Owner admin authentication is separate from the student experience.</small>';return}gate.classList.add("hidden");app.classList.remove("hidden");document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-tab]").forEach(x=>x.classList.remove("active"));b.classList.add("active");tab=b.dataset.tab;render()});render()}
async function render(){panel.innerHTML='<div class="spinner">Loading…</div>';if(tab==="questions")return questions();if(tab==="subjects")return subjects();if(tab==="chapters")return chapters();if(tab==="notes")return notes();if(tab==="quizzes")return quizzes()}
async function questions(){const {data:subs}=await supabase.from("subjects").select("id,name").order("name");const {data:rows}=await supabase.from("questions").select("*,subjects(name),chapters(name)").order("created_at",{ascending:false}).limit(100);panel.innerHTML=`<div class="card"><h2>Add MCQ</h2><form id="f" class="admin-form"><label class="full">Question<textarea name="question" rows="3" required></textarea></label><label>Subject<select name="subject_id"><option value="">None</option>${(subs||[]).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select></label><label>Difficulty<select name="difficulty"><option>easy</option><option selected>medium</option><option>hard</option></select></label>${["a","b","c","d"].map(o=>`<label>Option ${o.toUpperCase()}<input name="option_${o}" required></label>`).join("")}<label>Correct option<select name="correct_option"><option>A</option><option>B</option><option>C</option><option>D</option></select></label><label>Exam<select name="exam"><option value="class11">Class 11</option><option value="cee">CEE</option><option value="ioe">IOE</option></select></label><label class="full">Explanation<textarea name="explanation" rows="3"></textarea></label><label class="check full"><input type="checkbox" name="published" checked> Publish now</label><button class="btn btn-primary full">Save Question</button></form></div><div class="card" style="margin-top:20px"><h3>Recent questions</h3><div class="table-wrap"><table class="data-table"><tr><th>Question</th><th>Subject</th><th>Difficulty</th><th>Published</th><th></th></tr>${(rows||[]).map(r=>`<tr><td>${esc(r.question.slice(0,70))}</td><td>${esc(r.subjects?.name||"")}</td><td>${r.difficulty}</td><td>${r.published?"Yes":"No"}</td><td><button class="btn btn-danger btn-small del" data-id="${r.id}">Delete</button></td></tr>`).join("")}</table></div></div>`;document.getElementById("f").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.published=e.target.published.checked;const {error}=await supabase.from("questions").insert(d);if(error)alert(error.message);else render()};panel.querySelectorAll(".del").forEach(b=>b.onclick=async()=>{if(confirm("Delete this question?")){const {error}=await supabase.from("questions").delete().eq("id",b.dataset.id);if(error)alert(error.message);else render()}})}
async function subjects(){const {data}=await supabase.from("subjects").select("*").order("name");panel.innerHTML=`<div class="card"><h2>Add Subject</h2><form id="f" class="admin-form"><label>Name<input name="name" required></label><label>Code<input name="code"></label><label>Level<select name="level"><option value="class11">Class 11</option><option value="cee">CEE</option><option value="ioe">IOE</option></select></label><label>Published<select name="published"><option value="true">Yes</option><option value="false">No</option></select></label><label class="full">Description<textarea name="description"></textarea></label><button class="btn btn-primary full">Save Subject</button></form></div><div class="card" style="margin-top:20px"><h3>Subjects</h3><div class="table-wrap"><table class="data-table"><tr><th>Name</th><th>Level</th><th>Published</th><th></th></tr>${(data||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${x.level}</td><td>${x.published?"Yes":"No"}</td><td><button class="btn btn-danger btn-small del" data-id="${x.id}">Delete</button></td></tr>`).join("")}</table></div></div>`;bindSimple("subjects")}
async function chapters(){const {data:s}=await supabase.from("subjects").select("id,name").order("name");const {data:c}=await supabase.from("chapters").select("*,subjects(name)").order("chapter_number");panel.innerHTML=`<div class="card"><h2>Add Chapter</h2><form id="f" class="admin-form"><label>Subject<select name="subject_id" required>${(s||[]).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select></label><label>Chapter number<input name="chapter_number" type="number"></label><label class="full">Name<input name="name" required></label><label class="full">Description<textarea name="description"></textarea></label><label class="check full"><input type="checkbox" name="published" checked> Publish</label><button class="btn btn-primary full">Save Chapter</button></form></div><div class="card" style="margin-top:20px"><h3>Chapters</h3><div class="table-wrap"><table class="data-table"><tr><th>Chapter</th><th>Subject</th><th>Published</th><th></th></tr>${(c||[]).map(x=>`<tr><td>${x.chapter_number||""} · ${esc(x.name)}</td><td>${esc(x.subjects?.name||"")}</td><td>${x.published?"Yes":"No"}</td><td><button class="btn btn-danger btn-small del" data-id="${x.id}">Delete</button></td></tr>`).join("")}</table></div></div>`;document.getElementById("f").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.published=e.target.published.checked;const {error}=await supabase.from("chapters").insert(d);if(error)alert(error.message);else render()};deleteButtons("chapters")}
async function notes(){const {data:s}=await supabase.from("subjects").select("id,name").order("name");panel.innerHTML=`<div class="card"><h2>Add Note</h2><form id="f" class="admin-form"><label class="full">Title<input name="title" required></label><label>Subject<select name="subject_id"><option value="">None</option>${(s||[]).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select></label><label>Exam<select name="exam"><option value="class11">Class 11</option><option value="cee">CEE</option><option value="ioe">IOE</option></select></label><label class="full">Content<textarea name="content" rows="12" required></textarea></label><label class="check full"><input type="checkbox" name="published" checked> Publish</label><button class="btn btn-primary full">Save Note</button></form></div>`;document.getElementById("f").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.published=e.target.published.checked;const {error}=await supabase.from("notes").insert(d);if(error)alert(error.message);else{alert("Note saved.");render()}}}
async function quizzes(){const {data}=await supabase.from("quizzes").select("*").order("created_at",{ascending:false});panel.innerHTML=`<div class="card"><h2>Create Mock Test</h2><form id="f" class="admin-form"><label class="full">Title<input name="title" required></label><label>Exam<select name="exam"><option>class11</option><option>cee</option><option>ioe</option></select></label><label>Duration (minutes)<input type="number" name="duration_minutes" value="30"></label><label>Question count<input type="number" name="question_count" value="10"></label><label class="full">Description<textarea name="description"></textarea></label><label class="check full"><input type="checkbox" name="published" checked> Publish</label><button class="btn btn-primary full">Create Test</button></form></div><div class="card" style="margin-top:20px"><h3>Tests</h3><div class="table-wrap"><table class="data-table"><tr><th>Title</th><th>Exam</th><th>Duration</th><th>Published</th><th></th></tr>${(data||[]).map(x=>`<tr><td>${esc(x.title)}</td><td>${x.exam}</td><td>${x.duration_minutes} min</td><td>${x.published?"Yes":"No"}</td><td><button class="btn btn-danger btn-small del" data-id="${x.id}">Delete</button></td></tr>`).join("")}</table></div></div>`;bindSimple("quizzes")}
function bindSimple(table){document.getElementById("f").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.published=d.published==="true"||e.target.published?.checked;const {error}=await supabase.from(table).insert(d);if(error)alert(error.message);else render()};deleteButtons(table)}
function deleteButtons(table){panel.querySelectorAll(".del").forEach(b=>b.onclick=async()=>{if(confirm("Delete this item?")){const {error}=await supabase.from(table).delete().eq("id",b.dataset.id);if(error)alert(error.message);else render()}})}
start();
</script></body></html>
