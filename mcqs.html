<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Sampanna Edu educational platform"><title>MCQs | Sampanna Edu</title><link rel="stylesheet" href="css/style.css"></head><body><div id="site-header"></div><main><section class="page-hero"><div class="container"><span class="breadcrumb">Sampanna Edu / MCQs</span><h1>MCQ Practice</h1><p>Choose filters and start a practice set.</p></div></section><section class="section"><div class="container"><div class="toolbar"><select id="subject"><option value="">All subjects</option></select><select id="difficulty"><option value="">All difficulty</option><option>easy</option><option>medium</option><option>hard</option></select><button class="btn btn-primary" id="start">Start Practice</button></div><div id="status" class="empty">Select a subject if needed, then start practice.</div></div></section></main><div id="site-footer"></div><script type="module" src="js/app.js"></script><script type="module">
import { supabase } from "./js/supabase.js";
const subject=document.getElementById("subject"), diff=document.getElementById("difficulty"), status=document.getElementById("status");
async function init(){if(!supabase){status.textContent="Configure Supabase first.";return;}const {data}=await supabase.from("subjects").select("id,name").eq("published",true).order("name");(data||[]).forEach(s=>subject.insertAdjacentHTML("beforeend",`<option value="${s.id}">${esc(s.name)}</option>`))}
document.getElementById("start").onclick=()=>{const p=new URLSearchParams();if(subject.value)p.set("subject",subject.value);if(diff.value)p.set("difficulty",diff.value);location.href="practice.html?"+p}
function esc(x=""){return x.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}init();
</script></body></html>
