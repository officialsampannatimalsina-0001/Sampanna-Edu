<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Sampanna Edu MCQ practice"><title>Practice | Sampanna Edu</title><link rel="stylesheet" href="css/style.css"></head>
<body><div id="site-header"></div><main><section class="page-hero"><div class="container"><span class="breadcrumb">Sampanna Edu / Practice</span><h1>MCQ Practice</h1></div></section>
<section class="section"><div class="container" style="max-width:820px"><div id="quiz"><div class="spinner">Loading questions…</div></div></div></section></main><div id="site-footer"></div>
<script type="module">
import "./js/app.js";
import { supabase } from "./js/supabase.js";
import { getStudentProfile, saveAttempt } from "./js/student.js";
const params=new URLSearchParams(location.search),box=document.getElementById("quiz");
let questions=[],answers={},index=0,started=Date.now();
async function load(){
 if(!supabase){box.innerHTML='<div class="empty">Configure Supabase first.</div>';return;}
 let query=supabase.from("questions").select("*").eq("published",true).order("created_at",{ascending:false}).limit(20);
 if(params.get("subject")) query=query.eq("subject_id",params.get("subject"));
 if(params.get("difficulty")) query=query.eq("difficulty",params.get("difficulty"));
 const {data,error}=await query;
 if(error){box.innerHTML='<div class="empty">'+error.message+'</div>';return;}
 questions=data||[];
 if(!questions.length){box.innerHTML='<div class="empty">No published questions match this filter yet.</div>';return;}
 render();
}
function render(){
 const q=questions[index];
 box.innerHTML=`<div class="quiz-card"><div class="quiz-meta"><span>Question ${index+1} of ${questions.length}</span><span>${q.difficulty||"practice"}</span></div>
 <h2 style="margin-top:20px">${esc(q.question)}</h2><div>${["A","B","C","D"].map(o=>`<label class="quiz-option ${answers[q.id]===o?"selected":""}"><input type="radio" name="answer" value="${o}" ${answers[q.id]===o?"checked":""} style="display:none">${o}. ${esc(q["option_"+o.toLowerCase()]||"")}</label>`).join("")}</div>
 <div style="display:flex;justify-content:space-between;margin-top:22px"><button class="btn btn-secondary" id="prev" ${index===0?"disabled":""}>← Previous</button>${index===questions.length-1?'<button class="btn btn-primary" id="finish">Finish Quiz</button>':'<button class="btn btn-primary" id="next">Next →</button>'}</div></div>`;
 box.querySelectorAll(".quiz-option").forEach(l=>l.onclick=()=>{answers[q.id]=l.querySelector("input").value;render()});
 document.getElementById("prev")?.addEventListener("click",()=>{index--;render()});
 document.getElementById("next")?.addEventListener("click",()=>{index++;render()});
 document.getElementById("finish")?.addEventListener("click",finish);
}
function finish(){
 const score=questions.reduce((n,q)=>n+(answers[q.id]===q.correct_option?1:0),0);
 const p=getStudentProfile();
 saveAttempt({type:"practice",title:"MCQ Practice",score,totalQuestions:questions.length,timeSeconds:Math.round((Date.now()-started)/1000)});
 box.innerHTML=`<div class="result"><div style="font-size:50px">🎉</div><h2>Practice complete!</h2>
 <p>${esc(p?.name||"Student")}, you scored <strong>${score}/${questions.length}</strong> (${Math.round(score/questions.length*100)}%).</p>
 <p style="color:var(--muted)">Your result is saved in this browser and shown on your Student Dashboard.</p>
 <a class="btn btn-primary" href="mcqs.html">Practice Again</a> <a class="btn btn-secondary" href="dashboard.html">Dashboard</a></div>`;
}
function esc(x=""){return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
load();
</script></body></html>
